compliance_notes: >
  Approved only for the public unauthenticated AWS Price List file-download
  route documented at
  https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/using-the-aws-price-list-bulk-api-fetching-price-list-files-manually.html.
  Retain immutable bytes, headers, version and hash. No website-internal API,
  account data, resource creation, price approval or customer authorization.
  Robots observations remain unknown; this is a documented public download
  channel, not an assertion about permission to crawl other website pages.
  Source-specific 2 MiB cap and exact official host are mandatory.
notes: >
