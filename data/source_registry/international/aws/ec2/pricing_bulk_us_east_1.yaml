compliance_notes: >
  Public unauthenticated AWS Price List Bulk API download route documented at
  https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/using-the-aws-price-list-bulk-api-fetching-price-list-files-manually.html.
  Same official collection channel as the approved S3 bulk source. Full raw
  bytes and terms must be retained. No website-internal pricing endpoint or
  account data is accessed. A source-specific 512 MiB acquisition ceiling is
  required by the observed 481532363-byte official regional file. Other sources
  retain their 50 MiB ceiling. JSON structure is validated by a streaming parser
  before promotion; capture alone never grants pricing eligibility.
notes: >
