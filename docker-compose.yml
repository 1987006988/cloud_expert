services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cloud_expert_test
      POSTGRES_USER: cloud_expert
      POSTGRES_PASSWORD: cloud_expert_password
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud_expert -d cloud_expert_test"]
      interval: 5s
      timeout: 3s
      retries: 10

