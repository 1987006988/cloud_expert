[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-competitive-expert"
version = "0.1.0"
description = "Evidence-first Huawei Cloud competitive sales expert data foundation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111,<1",
    "pydantic>=2,<3",
    "SQLAlchemy>=2,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
    "tenacity>=8.2,<10",
    "PyYAML>=6,<7",
    "beautifulsoup4>=4.12,<5",
    "pypdf>=5,<7",
    "ijson>=3.4,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=5,<8",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".tmp", "data/raw", "test_outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"
markers = [
    "network: tests that access explicitly approved public network resources",
    "postgres: tests that require a live PostgreSQL database",
]

[tool.coverage.run]
branch = true
source = ["src/cloud_expert"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
