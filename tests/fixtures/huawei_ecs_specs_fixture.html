<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>通用入门型_弹性云服务器 ECS</title>
  </head>
  <body>
    <h1>通用入门型</h1>
    <p>
      弹性云服务器（Elastic Cloud Server，ECS）是由CPU、内存、操作系统、云硬盘组成的基础的计算组件。
    </p>
    <h2>通用入门型T6</h2>
    <p>该类型弹性云服务器默认开启超线程，每个vCPU对应一个底层超线程HT。</p>
    <table>
      <caption>表1 通用入门型T6规格</caption>
      <tr>
        <th>规格名称</th>
        <th>vCPU</th>
        <th>内存</th>
        <th>最大内网带宽</th>
        <th>最大收发包 PPS</th>
        <th>本地盘</th>
        <th>虚拟化类型</th>
      </tr>
      <tr>
        <td>t6.small.1</td>
        <td>1</td>
        <td>1 GiB</td>
        <td>0.5 Gbps</td>
        <td>10</td>
        <td>无</td>
        <td>KVM</td>
      </tr>
      <tr>
        <td>t6.large.2</td>
        <td>2</td>
        <td>4 GiB</td>
        <td>1 Gbps</td>
        <td>30</td>
        <td>1 x 100</td>
        <td>KVM</td>
      </tr>
    </table>
  </body>
</html>
