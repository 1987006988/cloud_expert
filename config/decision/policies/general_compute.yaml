schema_version: "1.0"
code: general_compute
version: "v1"
scenario_type: compute_general
description: "General compute internal decision policy."
effective_from: "2026-08-02T00:00:00+00:00"
status: active
dimensions:
  - technical_fit
  - availability_fit
  - regional_fit
  - compliance_fit
  - reliability_fit
  - operability_fit
  - migration_fit
  - cost_fit
  - evidence_quality
  - data_freshness
  - review_readiness
weights:
  technical_fit: 0.2000
  availability_fit: 0.1200
  regional_fit: 0.1000
  compliance_fit: 0.0800
  reliability_fit: 0.1000
  operability_fit: 0.0800
  migration_fit: 0.0800
  cost_fit: 0.1400
  evidence_quality: 0.0400
  data_freshness: 0.0300
  review_readiness: 0.0300
hard_blocks:
  - market_mode_mismatch
  - cpu_architecture_conflict
  - mandatory_cost_missing
missing_data_policy:
  mandatory: requires_review
  optional: exclude_dimension
  price: incomplete_cost
confidence_policy:
  minimum_for_ranking: 0.6500
  pending_review_penalty: 0.4000
thresholds:
  minimum_business_fit: 0.6500
  minimum_confidence: 0.6500
review_requirement:
  default_review_status: machine_generated
  customer_approval_allowed: false
rules:
  - code: technical_mapping_similarity
    version: "v1"
    dimension: technical_fit
    operator: greater_than_or_equal
    expected_value:
      minimum: 0.6500
    minimum_score: 0.0000
    maximum_score: 1.0000
    score_function: ratio_fit
    conditions:
      source: week7_mapping_candidate
    evidence_requirement:
      evidence_package_required: true
    missing_data_policy: requires_review
    priority: high
    status: active
  - code: evidence_package_completeness
    version: "v1"
    dimension: evidence_quality
    operator: evidence_at_least
    expected_value:
      minimum: 0.8500
    minimum_score: 0.0000
    maximum_score: 1.0000
    score_function: evidence_fit
    conditions:
      source: week8_evidence_package
    evidence_requirement:
      evidence_package_required: true
    missing_data_policy: penalize_confidence
    priority: high
    status: active
  - code: complete_tco_required
    version: "v1"
    dimension: cost_fit
    operator: equals
    expected_value:
      completeness_status: complete
    minimum_score: 0.0000
    maximum_score: 1.0000
    score_function: exact_match
    conditions:
      source: week9_tco_result
    evidence_requirement:
      price_snapshot_required: true
    missing_data_policy: requires_review
    priority: critical
    status: active
