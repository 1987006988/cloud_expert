schema_version: "1.0"
code: bounded_cost_audit
version: "v1"
scenario_type: compute_general
description: "Internal evidence and arithmetic audit, not workload suitability or vendor selection."
effective_from: "2026-09-29T00:00:00+00:00"
status: active
dimensions: [evidence_quality, data_freshness, review_readiness]
weights:
  evidence_quality: 0.4000
  data_freshness: 0.3000
  review_readiness: 0.3000
hard_blocks: [market_mode_mismatch, mandatory_cost_missing]
missing_data_policy:
  mandatory: block
  optional: exclude_dimension
  price: incomplete_cost
confidence_policy:
  minimum_for_ranking: 1.0000
thresholds:
  business_fit_enabled: false
  ranking_enabled: false
  minimum_business_fit: 1.0000
  minimum_confidence: 0.8500
review_requirement:
  default_review_status: machine_generated
  customer_approval_allowed: false
rules:
  - code: bounded_evidence_completeness
    version: "v1"
    dimension: evidence_quality
    operator: evidence_at_least
    expected_value: {minimum: 1.0000}
    minimum_score: 0.0000
    maximum_score: 1.0000
    score_function: evidence_fit
    conditions: {source: week8_evidence_package}
    evidence_requirement: {evidence_package_required: true}
    missing_data_policy: block
    priority: critical
    status: active
  - code: bounded_complete_tco
    version: "v1"
    dimension: cost_fit
    operator: equals
    expected_value: {completeness_status: complete}
    minimum_score: 0.0000
    maximum_score: 1.0000
    score_function: exact_match
    conditions: {source: week9_tco_result}
    evidence_requirement: {price_snapshot_required: true}
    missing_data_policy: block
    priority: critical
    status: active
